[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tpiva-parity-study"
version = "0.1.0"
description = "Reproducible helical-catalogue and periodic Delaunay parity experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "scipy>=1.10", "finufft>=2.3,<3", "matplotlib>=3.7",
                "nbformat>=5.9", "nbclient>=0.8", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
